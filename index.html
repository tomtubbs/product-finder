<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Wine finder</title>
<style>
  :root { --bg:#14171a; --card:#1f2428; --ink:#f2f4f5; --dim:#9aa5ad; --go:#2e9e5b; --stop:#c0392b; --hi:#ffd166; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px 16px 16px; background:var(--bg); color:var(--ink);
         font-family:-apple-system, Roboto, "Segoe UI", sans-serif; }
  h1 { font-size:16px; margin:0 0 8px; color:var(--dim); font-weight:600; }
  #status { color:var(--dim); font-size:15px; min-height:22px; margin:10px 0 0; }
  /* The two big buttons. Whichever one works best on this phone is the green one. */
  #mic, #start { width:100%; margin-top:10px; border:0; border-radius:14px; font-weight:700; color:#fff; }
  #mic { padding:26px 12px; font-size:24px; background:var(--go); }
  #mic.on { background:var(--stop); }
  #mic:disabled { opacity:.6; }
  #start { padding:14px 12px; font-size:18px; background:#3a424a; }
  #start[hidden] { display:none; }
  /* On the Google page: the big button that opens this same page outside Google. */
  #handover { display:block; width:100%; margin-top:10px; padding:26px 12px; font-size:24px; font-weight:700;
              border-radius:14px; color:#fff; background:var(--go); text-align:center; text-decoration:none; }
  #handover[hidden] { display:none; }
  body.handover.nomic #start { padding:14px 12px; font-size:18px; background:#3a424a; }
  body.typing #handover { padding:9px 12px; font-size:16px; background:#3a424a; }
  /* No list on this phone yet: only the instructions and the list box show. */
  body.nolist .row, body.nolist #mic, body.nolist #start, body.nolist > label { display:none; }
  #diag { margin-top:14px; color:var(--dim); font-size:15px; }
  #diag summary { padding:8px 0; }
  #log { margin:8px 0 0; padding:10px; border-radius:10px; background:var(--card); color:var(--ink);
         font:12px/1.35 ui-monospace, Menlo, monospace; white-space:pre-wrap; min-height:40px; }
  #listbox { margin-top:22px; color:var(--dim); font-size:16px; line-height:1.4; }
  #listbox[hidden] { display:none; }
  #listbox summary { padding:8px 0; font-weight:600; }
  #listbox textarea { width:100%; height:120px; margin-top:8px; padding:10px; font-size:16px; border-radius:12px;
                      border:1px solid #3a424a; background:var(--card); color:var(--ink); }
  #listbox button { margin:8px 8px 0 0; padding:12px 14px; font-size:16px; border:0; border-radius:12px;
                    background:#3a424a; color:var(--ink); }
  #listbox #savelist { background:var(--go); color:#fff; font-weight:700; }
  /* While the keyboard is up the Speak button slims down, so the answer stays in view. */
  body.typing #mic, body.typing.nomic #mic { padding:9px 12px; font-size:16px; background:#3a424a; }
  body.nomic #start { padding:26px 12px; font-size:24px; background:var(--go); }
  body.nomic #mic { padding:14px 12px; font-size:18px; background:#3a424a; }
  body.nomic #mic.on { background:var(--stop); }
  .row { display:flex; gap:8px; }
  #typed { flex:1; min-width:0; font-size:22px; padding:12px; border-radius:12px;
           border:1px solid #3a424a; background:var(--card); color:var(--ink); }
  #typed::placeholder { font-size:17px; color:var(--dim); }
  .row button { font-size:17px; padding:0 14px; border-radius:12px; border:0;
        background:#3a424a; color:var(--ink); }
  label { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:16px; color:var(--dim); }
  label input { width:22px; height:22px; flex:none; }
  label[hidden] { display:none; }
  label small { display:block; font-size:13px; opacity:.8; }
  #result { margin-top:10px; background:var(--card); border-radius:14px; padding:14px; min-height:150px; }
  #result .line { color:var(--dim); font-size:16px; line-height:1.4; }
  #result .desc { font-size:21px; font-weight:700; margin:4px 0 10px; }
  .loc { display:flex; gap:8px; }
  .loc div { flex:1; background:#2a3137; border-radius:12px; padding:8px 4px; text-align:center; }
  .loc small { display:block; color:var(--dim); font-size:13px; text-transform:uppercase; letter-spacing:.05em; }
  .loc b { font-size:44px; color:var(--hi); line-height:1.1; }
  .loc .bay { flex:1.6; background:#3b3413; }
  .loc .bay b { font-size:64px; }
  .extra { color:var(--dim); margin-top:8px; font-size:15px; }
  /* A line that also has reserve stock or bulk stock somewhere else. */
  .tag { margin-top:8px; padding:10px 12px; border-radius:12px; font-size:19px; font-weight:700; color:#fff; }
  .tag span { font-weight:400; }
  .tag.res { background:#1d4e6b; }
  .tag.bulk { background:#5b3a78; }
  .tag.home { background:#2f5d3a; }
  .tag.store { background:#6b4a1d; }
  .tag .at { margin-top:4px; }
  .tag small { display:block; margin-top:2px; font-size:15px; font-weight:400; opacity:.9; }
  #history .h-tag { display:inline-block; margin:4px 6px 0 0; padding:1px 8px; border-radius:8px; font-size:16px; color:#fff; }
  #history .h-tag.res { background:#1d4e6b; }
  #history .h-tag.bulk { background:#5b3a78; }
  #history .h-tag.home { background:#2f5d3a; }
  #history .h-tag.store { background:#6b4a1d; }
  .miss { font-size:22px; color:#ff8a80; font-weight:700; }
  #problem { display:none; margin-top:12px; padding:14px; border-radius:12px; background:#5a1f1a; color:#fff; font-size:16px; line-height:1.4; }
  #problem b { display:block; font-size:18px; margin-bottom:6px; }
  #problem small { display:block; margin-top:8px; opacity:.75; }
  #history { margin-top:16px; padding:0; list-style:none; }
  #history li { padding:12px 4px; border-bottom:1px solid #2a3137; font-size:24px; line-height:1.25; color:var(--dim); }
  #history li b { color:var(--ink); }
  #history .h-loc { color:var(--ink); margin:2px 0; }
  #history .h-loc b { color:var(--hi); }
  #history .h-loc span { white-space:nowrap; margin-right:.45em; }
</style>
</head>
<body onload="focusBox()">
<h1>Wine finder</h1>
<form class="row" name="finder" onsubmit="return false">
  <input id="typed" name="lineno" type="text" inputmode="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Loading…">
  <button type="button" id="kb" title="Switch keyboard">123</button>
  <button type="button" id="go">Find</button>
</form>
<button type="button" id="mic" disabled>Loading…</button>
<a id="handover" target="_top" hidden>🎙️ Open the speaking page</a>
<button type="button" id="start">⌨️ Use the keyboard</button>
<div id="problem"></div>
<div id="result"><div class="line" id="hint">Loading your list…</div></div>
<div id="status"></div>
<label><input type="checkbox" id="speak" checked> Say the location out loud</label>
<ul id="history"></ul>
<details id="listbox" hidden>
  <summary>Your list on this phone</summary>
  <div id="listinfo"></div>
  <textarea id="paste" placeholder="To add or replace the list by hand: copy the rows from your sheet (every column, with the heading row) and paste them here."></textarea>
  <button type="button" id="savelist">Save pasted list</button>
  <button type="button" id="droplist">Remove the list from this phone</button>
</details>
<details id="diag">
  <summary>Details for Claude (version 11)</summary>
  <label><input type="checkbox" id="closemic"> Close the microphone while the answer is spoken</label>
  <label id="cliprow" hidden><input type="checkbox" id="clips"> <span>Use the recorded voice<small>Not yet tried on a real phone</small></span></label>
  <pre id="log"></pre>
</details>

<script>
var rows = [], byLine = {}, listening = false, speaking = false, rec = null, wake = null;
var $ = function (id) { return document.getElementById(id); };
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var UA = navigator.userAgent;
var IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// This one file is used in two places. Inside your Google Sheet's web app it reads
// the sheet. Hosted as its own page outside Google it keeps a copy of the list on
// the phone, because that is the only place an iPhone lets a page listen by itself.
var IN_GOOGLE = !!(window.google && google.script && google.script.run);
// Where the copy outside Google lives. The Google page hands the list over to it.
var SPEAK_PAGE = 'https://tomtubbs.github.io/product-finder/';
// On an iPhone only the Safari app lets a page listen. Chrome, the Google app and
// pages opened inside chat or email apps are refused by the phone.
// Safari's own version number. From Safari 26 an iPhone no longer tells a page its true
// iOS version, so this is the number that tells an older iPhone from a newer one.
var SAFARI = IOS ? (UA.match(/Version\/([\d.]+)/) || [])[1] || '' : '';
var OTHER_BROWSER = IOS && /CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|FBAN|FBAV|Instagram|LinkedInApp|Line\//.test(UA);
// Phones only bring up the keyboard when you touch the screen, so there a
// button does the job instead of the page trying by itself.
var TOUCH = IOS || !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem('wf_' + k); localStorage.setItem('wf_' + k, v); } catch (e) {}
  return null;
}

function setRows(data) {
  rows = data; byLine = {};
  data.forEach(function (r) { (byLine[r.line] = byLine[r.line] || []).push(r); });
  document.body.classList.remove('nolist');
  // An iPhone never lets a page inside Google's page listen by itself.
  var canListen = SR && !(IN_GOOGLE && IOS);
  $('mic').style.display = canListen ? '' : 'none';
  $('mic').disabled = false;
  document.body.classList.toggle('nomic', !canListen || store('mic') === 'blocked');
  paint();
  $('typed').placeholder = 'Say or type line no';
  var voice = '<b style="color:var(--ink)">To use your voice:</b> ';
  var keys = 'tap <b>Use the keyboard</b>, then the microphone key on the keyboard. You can also type a number.';
  if (canListen) {
    hint(voice + 'tap <b>Speak a line number</b> and read out line numbers one at a time.<br>' +
      'If the phone will not let the page listen, ' + keys);
  } else {
    hint(voice + keys);
  }
  status(data.length + ' lines' + (locCount ? ' and ' + locCount + ' locations' : '') + ' loaded.');
  if (IN_GOOGLE && SPEAK_PAGE && data.length) offerHandover(data, canListen);
  focusBox();
}

/** On the Google page: a button that opens this same page outside Google and hands
 *  it the list. The list travels in the part of the link after the #, which stays
 *  on the phone and is never sent to any website. */
function offerHandover(data, canListen) {
  packRows(data).then(function (packed) {
    $('handover').href = SPEAK_PAGE + '#' + packed;
    $('handover').hidden = false;
    document.body.classList.add('handover');
    if (!canListen) {
      hint('<b style="color:var(--ink)">For one-tap voice:</b> tap <b>Open the speaking page</b>. ' +
        'It opens Wine finder outside Google, where the iPhone lets it listen, and takes today\'s list with it. ' +
        'The list stays on this phone.<br>Or stay here: tap <b>Use the keyboard</b>, then the microphone key.');
    }
  }, function () {});
}

function b64(bytes) {
  var t = '';
  for (var i = 0; i < bytes.length; i += 8192) t += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64(t) {
  var raw = atob(t.replace(/-/g, '+').replace(/_/g, '/')), out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
/** Squash a stream of bytes with the browser's own zip, or unsquash it. */
function pipe(bytes, stream) {
  var w = stream.writable.getWriter(), quiet = function () {};
  w.write(bytes).catch(quiet); w.close().catch(quiet);
  return new Response(stream.readable).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
}
/** The list as text that fits in a link: "z." squashed, or "j." plain. */
var FIELDS = ['line', 'wine', 'bay', 'shelf', 'seq', 'fac', 'desc', 'res', 'bulk', 'units', 'lockup', 'upstairs', 'home', 'resloc'];
var LOC_FIELDS = ['code', 'type', 'shelves', 'holds', 'notes'];
/** Each row as a short list of values in a fixed order, with empty ones on the end left off. */
function slim(list, fields) {
  return list.map(function (r) {
    var a = fields.map(function (f) { return txt(r[f]); });
    while (a.length > 1 && a[a.length - 1] === '') a.pop();
    return a;
  });
}
function fat(list, fields) {
  return (list || []).map(function (a) {
    var r = {};
    fields.forEach(function (f, i) { r[f] = txt(a[i]); });
    return r;
  });
}
function packRows(data) {
  // The lines alone, as before, or the lines and the storage locations together.
  var body = slim(data, FIELDS), spots = slim(locList(), LOC_FIELDS);
  var bytes = new TextEncoder().encode(JSON.stringify(spots.length ? { r: body, l: spots } : body));
  var plain = function () { return 'j.' + b64(bytes); };
  if (!window.CompressionStream || !window.DecompressionStream) return Promise.resolve(plain());
  try {
    return pipe(bytes, new CompressionStream('deflate-raw')).then(function (z) { return 'z.' + b64(z); }, plain);
  } catch (e) { return Promise.resolve(plain()); }
}
function unpackRows(packed) {
  var bytes = unb64(packed.slice(2));
  var ready = packed.charAt(0) === 'z' ? pipe(bytes, new DecompressionStream('deflate-raw')) : Promise.resolve(bytes);
  return ready.then(function (b) {
    var got = JSON.parse(new TextDecoder().decode(b)), out = [];
    // A link from an older page is just the list of lines.
    var list = Array.isArray(got) ? got : got.r, spots = Array.isArray(got) ? [] : got.l;
    fat(list, FIELDS).forEach(function (r) {
      r.line = r.line.replace(/\D/g, '');
      if (r.line) out.push(r);
    });
    return { rows: out, locs: fat(spots, LOC_FIELDS) };
  });
}
function txt(v) { return v === undefined || v === null ? '' : String(v).trim(); }
function status(t) { $('status').textContent = t; }
/** A running note of what the phone's listening and speaking did, with seconds since
 *  the page opened. It shows under "Details for Claude" and never holds line numbers. */
var logLines = [], t0 = Date.now();
function log(msg) {
  logLines.push(((Date.now() - t0) / 1000).toFixed(1) + '  ' + msg);
  if (logLines.length > 70) logLines.shift();
  $('log').textContent = logLines.join('\n');
}
/** The instructions shown in the answer card until the first answer replaces them. */
function hint(html) { var h = $('hint'); if (h) h.innerHTML = html; }

/** Put the cursor in the number box. Called when the page loads (from the body's
 *  onload), again when the list has arrived, and whenever you come back to the page. */
function focusBox() {
  if (TOUCH || listening) return;
  try { window.focus(); document.finder.lineno.focus(); } catch (e) {}
}

/** The keyboard button: puts the cursor in the box and brings up the full keyboard
 *  (the one with the microphone key), all inside the tap as the iPhone requires.
 *  It hides while the box is in use and comes back when the keyboard is put away. */
function grabBox() {
  if ($('typed').getAttribute('inputmode') !== 'text') setKeyboard('text', false);
  $('typed').blur(); $('typed').focus();
}
function paintStart() {
  var typing = document.activeElement === $('typed');
  $('start').hidden = typing;
  document.body.classList.toggle('typing', typing && TOUCH);
}
window.addEventListener('pageshow', focusBox);
// Some browsers ignore the first request, so ask again after a short wait: at
// half a second, 1, 2, 3.5 and 5 seconds after the page opens. This stops as
// soon as you touch the page, so it never fights with what you are doing.
var touched = false;
['touchstart', 'mousedown', 'keydown'].forEach(function (ev) {
  document.addEventListener(ev, function () { touched = true; }, true);
});
[500, 1000, 2000, 3500, 5000].forEach(function (ms) {
  setTimeout(function () { if (!touched) focusBox(); }, ms);
});
window.addEventListener('focus', function () { if (document.activeElement !== $('typed')) focusBox(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) focusBox(); });

var WORDS = { zero:'0', oh:'0', nought:'0', one:'1', two:'2', three:'3', four:'4', five:'5',
  six:'6', seven:'7', eight:'8', nine:'9' };
// Sound-alikes, only trusted when the page's own listening is on.
var LOOSE = { o:'0', won:'1', to:'2', too:'2', 'for':'4', ate:'8' };

/** Turn what was heard into digits, e.g. "five six 4 double 7 eight" -> 564778 */
function toDigits(text, strict) {
  var out = '', rep = 1;
  String(text).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').forEach(function (w) {
    if (w === 'double') { rep = 2; return; }
    if (w === 'triple' || w === 'treble') { rep = 3; return; }
    var d = /^\d+$/.test(w) ? w : (WORDS[w] || (strict ? undefined : LOOSE[w]));
    if (d === undefined) { rep = 1; return; }
    out += (rep > 1 && d.length === 1) ? new Array(rep + 1).join(d) : d;
    rep = 1;
  });
  return out;
}

/** Find a known line number in the digits heard. */
function match(digits) {
  if (!digits) return null;
  if (byLine[digits]) return digits;
  var best = null;
  Object.keys(byLine).forEach(function (line) {
    if (digits.indexOf(line) > -1 && (!best || line.length > best.length)) best = line;
  });
  return best;
}

var lastShown = '', lastShownAt = 0;

/** What a Reserves or Bulk cell in the sheet says: '' for nothing, true for a plain tick
 *  (or yes, y, x), or the words to show. A number in the Reserves column is a number of
 *  cases, so 45 becomes "45 cases"; 0 means there are none. */
function mark(v, cases) {
  v = txt(v);
  if (!v || /^(false|no|n|-|none)$/i.test(v)) return '';
  if (/^(true|yes|y|x|tick|\u2713|\u2714|\u2611)$/i.test(v)) return true;
  var num = v.replace(/,/g, '');
  if (/^\d+(\.\d+)?$/.test(num)) {
    if (!parseFloat(num)) return '';
    return cases ? v + (parseFloat(num) === 1 ? ' case' : ' cases') : v;
  }
  return v;
}
function tagHtml(cls, name, m, more) {
  return m ? '<div class="tag ' + cls + '">' + name + (m === true ? '' : '<span> - ' + esc(m) + '</span>') + (more || '') + '</div>' : '';
}

/* ---------- Storage locations ---------- */
// A line can carry a Home Location and a Reserve Location: short codes such as A7 or D13.
// The spreadsheet may also have a Locations tab, one row per code, saying whether the place
// is a cage or a pallet, how many shelves are above it, and which layouts' reserves it holds.
var locs = {}, locCount = 0;
function locKey(code) { return txt(code).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
/** Layout names are compared loosely: capitals, spaces and a final "s" make no difference. */
function layoutKey(name) { return txt(name).toLowerCase().replace(/[^a-z0-9]/g, '').replace(/s$/, ''); }
function setLocs(list) {
  locs = {}; locCount = 0;
  (list || []).forEach(function (l) {
    var k = locKey(l.code);
    if (!k || locs[k]) return;
    locs[k] = { code: txt(l.code), type: txt(l.type), shelves: txt(l.shelves), holds: txt(l.holds), notes: txt(l.notes) };
    locCount++;
  });
}
function locList() { return Object.keys(locs).map(function (k) { return locs[k]; }); }
/** The places named in a Home Location or Reserve Location cell. "D13, C4" is two places. */
function places(cell) {
  cell = txt(cell);
  if (!cell || /^(false|no|n|-|none|n\/a|na|0)$/i.test(cell)) return [];
  return cell.split(/\s*[,;&+\n]\s*|\s+and\s+/i).map(txt).filter(Boolean);
}
/** Places whose row on the Locations tab says they hold reserves for this layout.
 *  A layout there can carry a note in brackets, e.g. "White wine (upper shelf)". */
function placesFor(layout) {
  var want = layoutKey(layout), out = [];
  if (!want) return out;
  locList().forEach(function (l) {
    l.holds.split(/\s*[,;\n]\s*/).forEach(function (h) {
      var m = /^(.*?)\s*\(([^)]*)\)\s*$/.exec(h);
      if (layoutKey(m ? m[1] : h) === want) out.push(l.code + (m && txt(m[2]) ? ' ' + txt(m[2]) : ''));
    });
  });
  return out;
}
/** What the Locations tab says about a place, e.g. "Pallet, 2 shelves above". '' if it is not there. */
function locDetail(place) {
  var l = locs[locKey(place)] || locs[locKey(txt(place).split(/\s+/)[0])];
  if (!l) return '';
  var bits = [], s = l.shelves;
  if (l.type) bits.push(l.type);
  if (/^\d+$/.test(s)) bits.push(+s === 0 ? 'no shelves above' : +s === 1 ? '1 shelf above' : +s + ' shelves above');
  else if (/^(yes|y|true|x)$/i.test(s)) bits.push('shelving above');
  else if (/^(no|n|false|none|-)$/i.test(s)) bits.push('no shelves above');
  else if (s) bits.push(s);
  if (l.notes) bits.push(l.notes);
  var t = bits.join(', ');
  return t.charAt(0).toUpperCase() + t.slice(1);
}
/** Small print under a marker: what each place is. */
function placeLines(list) {
  var out = '';
  list.forEach(function (p) {
    var d = locDetail(p);
    if (d) out += '<small>' + (list.length > 1 ? '<b>' + esc(p) + '</b> · ' : '') + esc(d) + '</small>';
  });
  return out;
}
/** A code read out letter then number: "D13" is said as "D 13". */
function sayPlace(p) { return p.replace(/([A-Za-z])(\d)/g, '$1 $2'); }
/** Everything the sheet says about one row beyond its bay, shelf and position. */
function extras(r) {
  var e = { res: mark(r.res, true), bulk: mark(r.bulk), lockup: !!mark(r.lockup), upstairs: !!mark(r.upstairs),
    home: places(r.home), resAt: places(r.resloc), byLayout: false, spare: [], units: mark(r.units) };
  if (!e.res) { e.spare = e.resAt; e.resAt = []; }      // a reserve location, but no reserves marked
  // No reserve location on the line itself: the Locations tab may say where this layout's reserves are.
  else if (!e.resAt.length) { e.resAt = placesFor(r.wine); e.byLayout = e.resAt.length > 0; }
  return e;
}

function showLine(line) {
  var hits = byLine[line], html = '', spoken = [];
  // The same answer as a run of recorded clips: the digits, then bay, shelf and position.
  var clips = digitClips(line).concat([0.18]);
  hits.forEach(function (r, i) {

    for (var i = 0; i < ev.results.length; i++) text += pick(ev.results[i]) + ' ';
    heard = toDigits(text);
    var note = ev.results.length + ' phrase' + (ev.results.length === 1 ? '' : 's') + ', ' + heard.length + ' digits' +
      (final ? ', finished' : '') + (speaking ? ', while speaking' : '');
    if (note !== noted) { noted = note; log('heard ' + note); }
    // Our own spoken answer is heard too. None of that is for answering.
    if (speaking) { used = heard; return; }
    var fresh;
    if (heard.indexOf(used) === 0) {
      fresh = heard.slice(used.length);        // the text so far, plus something new on the end
    } else if (heard.length >= 4 && used.slice(-heard.length) === heard) {
      used = heard; return;                    // the phone only dropped older words: nothing new
    } else {
      // Newer iPhones begin their text again after every pause, so this is all new.
      if (used) log('text began afresh');
      used = ''; fresh = heard;
    }
    if (!fresh) return;
    // Just after we stop speaking, the end of our own sentence can still turn up.
    if (Date.now() < quietUntil && spoken.slice(-fresh.length) === fresh) { used = heard; return; }
    if (!voiceText || $('typed').value !== fresh) {
      voiceText = true;
      $('typed').value = fresh;
      boxChanged();
      status('Heard: ' + fresh);
    }
    // A finished phrase with a real line number in it is answered straight away.
    if (final && findLast(fresh)) { clearTimeout(evalTimer); evaluate(); }
  };
  r.onerror = function (ev) {
    log('listen ' + n + ' error ' + ev.error + (ev.message ? ' (' + ev.message + ')' : ''));
    if (rec !== r) return;
    if (ev.error === 'no-speech' || ev.error === 'aborted') return;   // normal pauses
    fail(ev.error, ev.message);
  };
  r.onend = function () {
    log('listen ' + n + ' ended');
    if (rec !== r) return;
    rec = null; heard = used = '';
    if (afterEnd) { var next = afterEnd; afterEnd = null; next(); }
    if (!listening || (speaking && closeMic)) return;
    // The phone stopped it by itself (often after a pause): go again, and do it right
    // here inside the phone's own "ended" signal, where an iPhone is most likely to allow it.
    quickEnds = (Date.now() - startedAt < 1000) ? quickEnds + 1 : 0;
    if (quickEnds >= 5) { fail('keeps-stopping'); return; }
    startRec(probation ? 'trying again' : 'again');
  };
  rec = r; deaf = false; heard = used = ''; quietUntil = 0; startedAt = Date.now();
  log('listen ' + n + ' asked for' + (why ? ' (' + why + ')' : ''));
  try { r.start(); } catch (e) { rec = null; log('start failed: ' + e.message); fail('start-failed', e.message); return; }
  clearTimeout(startTimer);
  startTimer = setTimeout(function () {
    if (!listening || rec !== r || started) return;
    log('listen ' + n + ' has not started after 4s');
    if (!everStarted) status('Waiting for the microphone. If the phone asks, tap Allow.');
    else if (probation > 0) { probation--; dropRec(); }   // asked too soon after speaking: ask again
    else fail('no-restart');                   // be honest: the phone has not carried on listening
  }, 4000);
  if (probation > 0) {
    // Opened straight after speaking. If it has heard nothing at all after a few seconds it
    // may have been opened too soon to get the microphone, so swap it for a new one.
    recycleTimer = setTimeout(function () {
      if (!listening || rec !== r || speaking || alive || !started || probation < 1) return;
      probation--;
      log('listen ' + n + ' has heard nothing: opening a new one');
      dropRec();
    }, probation > 1 ? 4500 : 6000);
  }
}

/** The best wording of one heard phrase: one with a real line number in it, if any. */
function pick(alts) {
  for (var a = 0; a < alts.length; a++) {
    if (findLast(toDigits(alts[a].transcript))) return alts[a].transcript;
  }
  return alts[0].transcript;
}

/** Forget what has been heard so far. Listening starts again once this one has ended. */
function dropRec() {
  deaf = true;
  var old = rec;
  if (!old) return;
  try { old.abort(); } catch (e) {}
  // If the phone never reports that it ended, carry on anyway.
  setTimeout(function () {
    if (rec !== old) return;
    rec = null;
    if (listening && !speaking) startRec();
  }, 1500);
}

function stopListening() {
  listening = false; log('stopped');
  probation = 0;
  clearTimeout(startTimer); clearTimeout(kickTimer); clearTimeout(recycleTimer);
  dropRec();
  if (voiceText) clearBox();
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
  paint();
}

/** Remember whether this phone lets the page listen, so the right button is the big green one. */
function setBlocked(yes) {
  document.body.classList.toggle('nomic', yes);
  store('mic', yes ? 'blocked' : 'ok');
  paint();
}

function fail(code, detail) {
  stopListening();
  if (!everStarted && /^(not-allowed|service-not-allowed|start-failed)$/.test(code)) setBlocked(true);
  problem(code, detail);
}

/** Show a plain-English explanation of why listening failed. */
function problem(code, detail) {
  var box = $('problem');
  if (!code) { box.style.display = 'none'; return; }
  var head = 'The Speak button cannot listen', fix;
  var keyboard = ' Tap <b style="display:inline">Use the keyboard</b>, then the microphone key on the keyboard.';
  if (everStarted && code !== 'audio-capture' && code !== 'network') {
    head = 'Listening stopped';
    fix = (code === 'no-restart' ? 'The phone did not open the microphone again by itself. ' : '') +
      'Tap the Speak button to carry on, or tap <b style="display:inline">Use the keyboard</b>.';
  } else if (code === 'service-not-allowed' && IOS && !IN_GOOGLE) {
    // The iPhone's own speech service said no, before the microphone was even tried.
    head = 'The iPhone would not let the page listen';
    fix = OTHER_BROWSER
      ? 'This page is open in an app other than Safari. On an iPhone only the Safari app lets a page listen. ' +
        'Copy the link, open it in Safari and try again. Until then:' + keyboard
      : 'Check these on this iPhone, then reload the page and try the Speak button again.<br>' +
        '1. The page is open in the Safari app, not Chrome or another app.<br>' +
        '2. In Settings, General, Keyboard: Enable Dictation is on.<br>' +
        '3. In Settings, Privacy &amp; Security, Speech Recognition: Safari is on.<br>' +
        'Until then:' + keyboard;
  } else if (code === 'service-not-allowed' || code === 'not-allowed' || code === 'start-failed') {
    fix = 'The phone would not let this page use the microphone by itself.' + keyboard +
      (IN_GOOGLE ? '' : ' If the phone asked and you tapped Don\'t Allow, reload the page and tap Allow.');
  } else if (code === 'audio-capture') {
    fix = 'No microphone was found. Close other apps using the microphone and try again.';
  } else if (code === 'network') {
    fix = 'Speech needs a data connection and could not reach it. Check your signal.';
  } else {
    fix = 'Listening stopped unexpectedly.' + keyboard;
  }
  box.innerHTML = '<b>' + head + '</b>' + fix +
    '<small>Code to tell Claude: ' + esc(code) + (detail ? ' (' + esc(detail) + ')' : '') + '</small>';
  box.style.display = 'block';
  status('');
}

function paint() {
  var again = document.body.classList.contains('nomic');
  $('mic').classList.toggle('on', listening);
  $('mic').textContent = listening ? 'Listening… tap to stop'
    : (again ? '🎙️ Try the Speak button again' : '🎙️ Speak a line number');
}

$('mic').onclick = function () {
  if (listening) { stopListening(); status('Stopped.'); return; }
  log('tap Speak');
  listening = true; quickEnds = 0; probation = 0;
  $('typed').blur();
  clearBox(); problem('');
  paint();
  status('Starting the microphone…');
  startRec('tap');           // straight from the tap, as the phone requires
  unlockSpeech(); keepAwake();
};

$('closemic').checked = closeMic;
$('closemic').onchange = function () {
  closeMic = this.checked; store('closemic2', closeMic ? '1' : '0');
  log('close the microphone while speaking: ' + (closeMic ? 'on' : 'off'));
};
// An iPhone no longer tells a page its real iOS version, so only Safari's version is shown.
log('version 11, ' + (IOS ? 'iPhone' + (OTHER_BROWSER ? ', not Safari' : ', Safari' + (SAFARI ? ' ' + SAFARI : '')) : 'not iPhone') +
  (IN_GOOGLE ? ', inside Google' : ', outside Google') + (SR ? '' : ', no listening in this browser') +
  (useClips ? ', recorded voice' : ', phone voice') + (closeMic ? ', microphone closes to speak' : ''));

/* ---------- The page outside Google: the list is kept on this phone ---------- */
function savedList() {
  try { var v = JSON.parse(localStorage.getItem('wf_rows')); return v && v.rows && v.rows.length ? v : null; } catch (e) { return null; }
}
/** Use this list from now on and keep it on the phone. */
function keepList(data, how, spots) {
  var kept = true;
  // A list from the sheet brings its storage locations with it. A list pasted in by hand
  // has none, so the ones already on the phone stay.
  if (spots) setLocs(spots);
  try { localStorage.setItem('wf_rows', JSON.stringify({ at: Date.now(), rows: data, locs: locList() })); } catch (e) { kept = false; }
  setRows(data);
  listInfo();
  status(data.length + ' lines' + (locCount ? ' and ' + locCount + ' locations ' : ' ') + how + '.' + (kept ? '' : ' This phone would not keep them, so they last until the page is closed.'));
}
function listInfo() {
  var v = savedList(), box = $('listbox');
  box.hidden = false;
  if (!v) { $('listinfo').textContent = rows.length ? rows.length + ' lines in use, not kept on this phone.' : 'No list on this phone.'; return; }
  var d = new Date(v.at);
  $('listinfo').textContent = v.rows.length + ' lines' + (v.locs && v.locs.length ? ' and ' + v.locs.length + ' locations' : '') +
    ' kept on this phone, last updated ' +
    d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' at ' +
    d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '. ' +
    'To update it, open the Wine finder link for your Google Sheet (it starts with script.google.com) and tap Open the speaking page there.';
}
function noList(why) {
  rows = []; byLine = {}; setLocs([]);
  document.body.classList.add('nolist');
  $('result').innerHTML = '<div class="line" id="hint"></div>';
  $('history').innerHTML = ''; lastShown = '';
  hint((why ? '<b style="color:#ff8a80">' + esc(why) + '</b><br>' : '') +
    '<b style="color:var(--ink)">No list on this phone yet.</b><br>' +
    'This page cannot read your Google Sheet by itself. Open the Wine finder link for your sheet ' +
    '(the web app link, which starts with script.google.com) and tap the green <b>Open the speaking page</b> button there. ' +
    'That brings the list here and keeps a copy on this phone.');
  status('');
  listInfo();
  $('listbox').open = true;
}

/** Rows copied from the sheet and pasted in: tabs between cells, one row per line. */
function parsePasted(text) {
  var grid = String(text).split(/\r?\n/).filter(function (l) { return l.replace(/\s/g, ''); })
    .map(function (l) { return l.indexOf('\t') > -1 ? l.split('\t') : l.split(','); });
  if (!grid.length) return [];
  var head = grid[0].map(function (h) { return String(h).toLowerCase().replace(/[^a-z]/g, ''); });
  var col = function (names) {
    for (var i = 0; i < names.length; i++) { var c = head.indexOf(names[i]); if (c > -1) return c; }
    return -1;
  };
  var c = { wine: col(['wine', 'type']), bay: col(['bay', 'block']), shelf: col(['shelf']),
    seq: col(['seq', 'position', 'pos']), fac: col(['fac', 'facings']),
    line: col(['lineno', 'line', 'linenumber']), desc: col(['description', 'desc', 'product']),
    res: -1, bulk: -1, units: -1, lockup: -1, upstairs: -1, home: -1, resloc: -1 };
  // The optional columns are found by a word in their heading, wherever they sit:
  // "reserve" with "location", "reserve", "bulk", "home", "lockup" or "downstairs", "upstairs", "unit".
  var taken = Object.keys(c).map(function (k) { return c[k]; });
  head.forEach(function (h, i) {
    if (taken.indexOf(i) > -1) return;
    var has = function (w) { return h.indexOf(w) > -1; };
    var k = has('reserve') ? (has('loc') ? 'resloc' : 'res') : has('bulk') ? 'bulk' : has('home') ? 'home'
      : has('lockup') || has('downstairs') ? 'lockup' : has('upstairs') ? 'upstairs' : has('unit') ? 'units' : '';
    if (k && c[k] < 0) c[k] = i;
  });
  var first = 1;
  // No heading row: take columns A to G in the sheet's usual order.
  // Without headings there is no telling which later column is which, so the optional ones are left out.
  if (c.line < 0) { Object.keys(c).forEach(function (k) { c[k] = -1; }); c.wine = 0; c.bay = 1; c.shelf = 2; c.seq = 3; c.fac = 4; c.line = 5; c.desc = 6; first = 0; }
  var out = [];
  for (var r = first; r < grid.length; r++) {
    var v = grid[r], line = String(v[c.line] || '').replace(/\D/g, '');
    if (!line) continue;
    var row = { line: line };
    FIELDS.forEach(function (f) { if (f !== 'line') row[f] = txt(v[c[f]]); });
    out.push(row);
  }
  return out;
}

$('savelist').onclick = function () {
  var data = parsePasted($('paste').value);
  if (!data.length) { $('listinfo').textContent = 'No line numbers found in that. Copy every column, including the heading row, and paste again.'; return; }
  $('paste').value = '';
  keepList(data, 'saved');
  $('listbox').open = false;
};
$('droplist').onclick = function () {
  if (listening) stopListening();
  try { localStorage.removeItem('wf_rows'); } catch (e) {}
  noList('The list has been removed from this phone.');
};

/** Outside Google: take a list handed over in the link, or the one kept on the phone. */
function bootOutside() {
  var packed = location.hash.slice(1);
  var useSaved = function (why) { var v = savedList(); if (v) { setLocs(v.locs); setRows(v.rows); listInfo(); } else noList(why); };
  if (!/^[zj]\./.test(packed)) { useSaved(); return; }
  // Take the list out of the address bar straight away, so it is not left in a bookmark.
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  var bad = 'That link did not carry a list this page could read.';
  try {
    unpackRows(packed).then(function (d) {
      if (d.rows.length) keepList(d.rows, 'brought over from your sheet', d.locs); else useSaved(bad);
    }, function () { useSaved(bad); });
  } catch (e) { useSaved(bad); }
}

if (IN_GOOGLE) {
  google.script.url.getLocation(function (loc) {
    var key = (loc.parameter && loc.parameter.key) || '';
    // getData brings the lines and the Locations tab together. A Code.gs from before
    // version 10 only has getRows, so that is asked instead.
    var ask = function (fn) {
      var run = google.script.run.withSuccessHandler(function (d) {
        if (!d || Array.isArray(d)) setRows(d || []); else { setLocs(d.locs); setRows(d.rows || []); }
      }).withFailureHandler(function (err) {
        if (fn === 'getData') { ask('getRows'); return; }
        $('mic').textContent = 'Not loaded'; $('typed').placeholder = 'Not loaded';
        $('hint').textContent = 'Could not load the sheet: ' + err.message;
      });
      if (typeof run[fn] === 'function') run[fn](key); else if (fn === 'getData') ask('getRows');
    };
    ask('getData');
  });
} else if (window.__TEST_ROWS__) {
  setLocs(window.__TEST_LOCS__);
  setRows(window.__TEST_ROWS__);
} else {
  bootOutside();
  window.addEventListener('hashchange', bootOutside);
}
</script>
</body>
